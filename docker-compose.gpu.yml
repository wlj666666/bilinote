
services:
  backend:
    container_name: bilinote-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
      args:
        # 国内拉不到 docker.io 时设置 BASE_REGISTRY（与 CPU 栈相同，只需能拉
        # python:3.11-slim；CUDA 运行时由 pip wheel + nvidia-container-toolkit 提供，
        # 不再要求镜像源支持 nvidia/cuda 命名空间）
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8483}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////legacy/bili_note.db}
      DATA_DIR: /legacy/data
      NOTE_OUTPUT_DIR: /legacy/note_results
      OUT_DIR: /legacy/static/screenshots
      STATIC_ROOT: /legacy/static
      UPLOAD_ROOT: /legacy/uploads
      VECTOR_DB_DIR: /legacy/vector_db
      TASK_RUNTIME_DIR: /legacy/data/task_runtime
      OCR_DEVICE: ${OCR_DEVICE:-cuda}
      # 信任来自 Docker 网段的 X-Forwarded-For，让登录限流按真实客户端 IP 计数
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      PYTHONPATH: /app
    working_dir: /legacy
    command: ["python3", "/app/main.py"]
    volumes:
      # Keep the legacy backend data layout writable without masking image code in /app.
      - ./backend:/legacy
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    expose:
      - "${BACKEND_PORT:-8483}"  # 不再对外暴露，用于 nginx 内部通信
    # 用 unless-stopped 避免短暂崩溃把容器永久打死后再也读不到 .env 修改
    restart: unless-stopped
    healthcheck:
      # 同 docker-compose.yml：用公开的 /api/sys_check，不能用需要管理员鉴权的
      # /api/sys_health，否则容器恒 unhealthy，nginx 永远不启动。
      test: ["CMD", "curl", "-fsS", "http://localhost:${BACKEND_PORT:-8483}/api/sys_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s   # GPU 镜像首次加载 CUDA 比 CPU 慢，给久一点
    # GPU 部署默认跑较大模型，把内存限制提到 8g 避免 host OOM
    mem_limit: 8g
    # OCR / ffmpeg 多进程会用到 /dev/shm，容器默认只有 64M，容易炸
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: "nvidia"
              count: "all"
              capabilities: ["gpu"]

  frontend:
    container_name: bilinote-frontend
    build:
      context: .
      dockerfile: BillNote_frontend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    env_file:
      - .env
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问
    restart: unless-stopped
    mem_limit: 512m

  nginx:
    container_name: bilinote-nginx
    # 走 BASE_REGISTRY，否则国内拉不到 docker.io 时其它服务能换源、nginx 换不了
    image: ${BASE_REGISTRY:-docker.io}/library/nginx:1.25-alpine
    ports:
      - "${APP_PORT:-3015}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8483}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
