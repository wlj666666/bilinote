name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements-ci.txt
            backend/requirements.txt
            backend/requirements-ocr.txt
      - name: Install OCR system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BillNote_frontend
    env:
      DOCKER_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: BillNote_frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test CI diagnostic gate
        run: pnpm test:ci
      - name: Check types and lint against existing diagnostics
        run: pnpm check:ci
      - name: Build frontend
        run: pnpm build

  result:
    name: CI result
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success
