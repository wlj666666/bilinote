server {
  listen 80;
  client_max_body_size 10G;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # 兼容旧客户端的同步接口；网页问答使用 /api/chat/jobs 的短请求轮询。
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 30s;
  # 大文件上传直通后端，避免 nginx 先把 10G 缓冲落盘再转发
  proxy_request_buffering off;

  # 多容器(docker-compose)部署：前端在独立的 frontend 容器，代理过去。
  # 单镜像(Dockerfile.complete)部署请勿用本文件，改用 nginx/standalone.conf。
  location / {
    proxy_pass http://frontend:80;
  }

  location /api/ {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 必须透传真实客户端 IP：后端登录限流按 request.client.host 计数，
    # 少了这一行所有用户会共用 nginx 容器 IP 一个桶，第 11 次登录就 429。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://backend:${BACKEND_PORT}/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Backend checks ownership; private files must not enter shared caches.
    proxy_no_cache 1;
  }
}
