server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;

  location = / { try_files /index.html =404; }
  location = /index.html { return 308 /; }
  location = /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /app/index.html =404;
  }
  location = /sitemap.xml { try_files $uri =404; }
  location /guides/ { try_files $uri $uri/ =404; }
  location /marketing/ { try_files $uri =404; }
  location /assets/ { try_files $uri =404; }

  location / {
    # Existing /admin and /settings deep links still load the React workspace.
    try_files $uri $uri/ /app/index.html;
  }
}
