# 单镜像（Dockerfile.complete / 一体化部署）专用 nginx 配置。
#
# 与 nginx/default.conf（docker-compose 多容器版）的关键区别：
#   - 前端不再由独立的 frontend 容器提供，构建产物已直接 COPY 到本镜像的
#     /usr/share/nginx/html，所以 location / 走【静态文件】而非反代 frontend；
#   - backend 与 nginx 同处一个容器，所以 /api、/static 代理到本机 BACKEND_PORT。
#
# 注意：请勿把本文件的 location / 改成代理 frontend，否则单镜像里没有 frontend
# 服务，会回退到 nginx 默认欢迎页。多容器（compose）请改 nginx/default.conf。
server {
  listen 80;
  client_max_body_size 10G;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # 长 LLM 调用默认 60s 会被 nginx 掐成 504
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 30s;
  # 大文件上传直通后端，避免 nginx 先缓冲 10G 落盘
  proxy_request_buffering off;

  # 前端静态文件由本容器直接服务（构建产物已 COPY 到此目录）
  location = / { try_files /index.html =404; }
  location = /index.html { return 308 /; }
  location = /app {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /app/index.html =404;
  }
  location = /sitemap.xml { try_files $uri =404; }
  location /guides/ { try_files $uri $uri/ =404; }
  location /marketing/ { try_files $uri =404; }
  location /assets/ { try_files $uri =404; }
  location / {
    try_files $uri $uri/ /app/index.html;
  }

  # backend 与 nginx 同容器，代理到本地
  location /api/ {
    proxy_pass http://127.0.0.1:${BACKEND_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 单镜像里 nginx 与 backend 同机，127.0.0.1 本身就能区分用户；
    # 但保留 X-Forwarded-For 以便将来套外层反代时 IP 不被覆盖。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://127.0.0.1:${BACKEND_PORT}/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_no_cache 1;
  }
}
